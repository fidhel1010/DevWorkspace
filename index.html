<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev-Workspace</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <!-- LAYAR UTAMA / DASHBOARD -->
    <section id="auth-screen">
        <div class="container-auth">
            <div class="form-box login">
                <form action="">
                    <div class="logo">
                        <img src="/assets/logo.jpg" alt="DevWorkspace Logo" class="logo-img">
                        <h1><span>Dev</span>Workspace</h1>
                    </div>
                    <h1>Sign in to Your Workspace</h1>
                    <div class="input-box">
                        <input type="text" placeholder="Username" required>
                        <i class="fa-solid fa-user"></i>
                    </div>

                    <div class="input-box">
                        <input type="password" placeholder="Password" required>
                        <i class="fa-solid fa-lock"></i>
                    </div>
                    
                    <div class="forget-link">
                        <a href="#">Forget Password</a>
                    </div>
                    <button type="submit" class="btn-login">Login</button>
                    <p>Or login with social platforms</p>
                    <div class="social-icons">
                        <a href="#"><i class="fa-solid fa-lock"></i></a>
                        <a href="#"><i class="fa-brands fa-facebook"></i></a>
                        <a href="#"><i class="fa-brands fa-github"></i></a>
                        <a href="#"><i class="fa-brands fa-linkedin"></i></a>
                    </div>
                </form>
            </div>

            <div class="form-box register">
                <form action="">
                    <h1>Registration</h1>
                    <div class="input-box">
                        <input type="text" placeholder="Username" required>
                        <i class="fa-solid fa-user"></i>
                    </div>

                    <div class="input-box">
                        <input type="email" placeholder="Password" required>
                        <i class="fa-solid fa-lock"></i>
                    </div>

                    <div class="forget-link">
                        <a href="#">Forget Password</a>
                    </div>
                    <button type="submit" class="btn-login"></button>
                    <p>Or register with social platforms</p>
                    <div class="social-icons">
                        <a href="#"><i class="fa-solid fa-lock"></i></a>
                        <a href="#"><i class="fa-brands fa-facebook"></i></a>
                        <a href="#"><i class="fa-brands fa-github"></i></a>
                        <a href="#"><i class="fa-brands fa-linkedin"></i></a>
                    </div>
                </form>
            </div>
            <div class="toggle-box">
                <div class="toggle-panel toggle-left">
                    <h1>Hello, Welcome!</h1>
                    <p>Don't have an account</p>
                    <button class="btn-register">Register</button>
                </div>

                <div class="toggle-panel toggle-right">
                    <h1>Welcome Back!</h1>
                    <p>Already have an account</p>
                    <button class="btn-register">Login</button>
                </div>

            </div>
        </div>
    </section>

    <section id="dashboard-screen" class="hidden">
        <aside class="sidebar">
            <div class="profile-card">

            </div>
        </aside>
    </section>

    <script src="script.js"></script>
</body>
</html>
